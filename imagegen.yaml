# 生图模型/API 独立目录。只抓厂商第一方页面；第三方托管价不作为官方价格。
providers:
  - id: openai
    name: OpenAI
    region: 国际
    category: api
    language: en-US
    official_domains: [cdn.openai.com, developers.openai.com, openai.com]
    imagegen_urls:
      - https://developers.openai.com/api/docs/pricing
      - https://developers.openai.com/api/docs/guides/image-generation
    examples:
      - title: GPT Image 2 官方生成与编辑案例
        url: https://openai.com/index/introducing-chatgpt-images-2-0/
        media_url: https://cdn.openai.com/API/docs/images/images-gallery-2/sci-fi-hangar.png
        note: OpenAI 官方发布页与稳定官方样图

