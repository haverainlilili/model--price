# 厂商配置 —— 增删厂商只需要改这个文件, 不用动代码
#
# id:            唯一标识(用作数据文件名)
# name / name_cn: 展示名
# region:        分组(国际 / 国内), 仅用于展示
# pricing_url:   官网公开价格页; 价格分散在多个页面时改用 pricing_urls 列表
#                (各页文本拼接后一起送抽取, Kimi 按模型分页就是这么处理的)
# render:        true = 页面由前端脚本渲染, 需要无头浏览器(智谱/火山方舟)
# news_url:      官网公开公告 / changelog 页(可选; 没有就不追踪该厂商公告)
# news_render:   true = 公告页也需要前端脚本渲染
#
# 入口选型(2026-08 实测): 优先选 .md / docs 这类对爬虫友好的文档源, 拿到的
# 就是干净的价格表; open.bigmodel.cn 与 volcengine.com 是纯前端渲染必须走
# render; docs.x.ai 与 mistral.ai 在本地网络 SSL 握手被断(疑似区域屏蔽),
# 交给 GitHub Actions 的海外 runner 首次运行验证。
providers:
  - id: anthropic
    name: Anthropic
    name_cn: Anthropic (Claude)
    region: 国际
    pricing_url: https://platform.claude.com/docs/en/about-claude/models/overview.md
    news_url: https://platform.claude.com/docs/en/release-notes/overview.md
  - id: openai
    name: OpenAI
    name_cn: OpenAI
    region: 国际
    pricing_url: https://platform.openai.com/docs/pricing
    news_url: https://platform.openai.com/docs/changelog
  - id: google
    name: Google
    name_cn: Google Gemini
    region: 国际
    pricing_url: https://ai.google.dev/gemini-api/docs/pricing
    news_url: https://ai.google.dev/gemini-api/docs/changelog
  - id: xai
    name: xAI
    name_cn: xAI (Grok)
    region: 国际
    pricing_url: https://docs.x.ai/docs/models
    render: true
  - id: mistral
    name: Mistral
    name_cn: Mistral
    region: 国际
    pricing_url: https://docs.mistral.ai/inference/pricing
    render: true
    news_url: https://mistral.ai/news
    news_render: true
  - id: deepseek
    name: DeepSeek
    name_cn: DeepSeek
    region: 国内
    pricing_url: https://api-docs.deepseek.com/zh-cn/quick_start/pricing
    news_url: https://api-docs.deepseek.com/zh-cn/updates
  - id: qwen
    name: Alibaba
    name_cn: 阿里云百炼 (Qwen)
    region: 国内
    pricing_url: https://help.aliyun.com/zh/model-studio/model-pricing.md
    news_url: https://help.aliyun.com/zh/model-studio/model-release-notes.md
  - id: doubao
    name: ByteDance
    name_cn: 火山方舟 (豆包)
    region: 国内
    pricing_url: https://www.volcengine.com/docs/82379/1099320
    render: true
  - id: zhipu
    name: Zhipu
    name_cn: 智谱 (GLM)
    region: 国内
    pricing_url: https://open.bigmodel.cn/pricing
    render: true
    news_url: https://docs.bigmodel.cn/cn/update/new-releases.md
  - id: moonshot
    name: Moonshot
    name_cn: 月之暗面 (Kimi)
    region: 国内
    pricing_urls:
      - https://platform.kimi.com/docs/pricing/chat.md
      - https://platform.kimi.com/docs/pricing/chat-k3.md
      - https://platform.kimi.com/docs/pricing/chat-k27-code.md
      - https://platform.kimi.com/docs/pricing/chat-k26.md
      - https://platform.kimi.com/docs/pricing/chat-k25.md
      - https://platform.kimi.com/docs/pricing/chat-v1.md
    news_url: https://platform.kimi.com/docs/changelog/changelog/moonlight.md
  - id: minimax
    name: MiniMax
    name_cn: MiniMax
    region: 国内
    pricing_url: https://platform.minimaxi.com/docs/guides/pricing-paygo.md
    news_url: https://platform.minimaxi.com/docs/release-notes/models.md
