# 厂商配置 —— 增删厂商只需要改这个文件, 不用动代码
#
# id:            唯一标识(用作数据文件名)
# name / name_cn: 展示名
# region:        分组(国际 / 国内), 仅用于展示
# language:      官网抓取语言；国际厂商固定 en-US，国内厂商默认 zh-CN
# pricing_url:   官网公开价格页; 价格分散在多个页面时改用 pricing_urls 列表
#                (各页文本拼接后一起送抽取, Kimi 按模型分页就是这么处理的)
# render:        true = 页面由前端脚本渲染, 需要无头浏览器(智谱/火山方舟)
# news_url:      机器抓取的官网公告 / changelog 来源
# official_news_url: 用户点击「官方公告」时打开的厂商公告主页
# news_render:   true = 公告页也需要前端脚本渲染
# plan_url(s):   官网公开套餐页；只抽取官网同时明示价格与额度的方案
# plan_render:   true = 套餐页需要前端脚本渲染
# websearch_url: 官网联网搜索能力/定价说明页；只抽取客观事实(有无搜索/是否引用来源/
#                是否默认开启/定价), 页面缺失时该板块回退到 data/websearch 种子数据。
# websearch_render: true = 该页需要前端脚本渲染
#
# 入口选型(2026-08 实测): 优先选 .md / docs 这类对爬虫友好的文档源, 拿到的
# 就是干净的价格表; open.bigmodel.cn 与 volcengine.com 是纯前端渲染必须走
# render; docs.x.ai 与 mistral.ai 在本地网络 SSL 握手被断(疑似区域屏蔽),
# 交给 GitHub Actions 的海外 runner 首次运行验证。
#
# 注意: websearch_url 多为「能力说明页」而非「价格页」, 部分国内厂商入口是
# 文档站自动重定向或需登录, 抓取失败时单厂商回退、不影响其它厂商。
