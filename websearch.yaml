# 联网搜索对比独立配置。
# category: model=模型内置搜索；ai-search=面向 AI/RAG 的独立搜索 API；serp=原始搜索引擎结果 API。
# websearch_urls 可同时抓取能力页与价格页；页面 hash 无变化时不会调用结构化抽取模型。
providers:
  # 模型内置联网搜索
  - id: anthropic
    name: Anthropic (Claude)
    region: 国际
    category: model
    language: en-US
    websearch_url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool
  - id: openai
    name: OpenAI
    region: 国际
    category: model
    language: en-US
    websearch_urls:
      - https://developers.openai.com/api/docs/guides/tools-web-search
      - https://developers.openai.com/api/docs/pricing
  - id: google
    name: Google Gemini
    region: 国际
    category: model
    language: en-US
    websearch_urls:
      - https://ai.google.dev/gemini-api/docs/google-search
      - https://ai.google.dev/gemini-api/docs/pricing?hl=en
  - id: xai
    name: xAI (Grok)
    region: 国际
    category: model
    language: en-US
    websearch_url: https://docs.x.ai/docs/tools
    websearch_render: true
  - id: mistral
    name: Mistral
    region: 国际
    category: model
    language: en-US
    websearch_url: https://docs.mistral.ai/capabilities/web-search/
    websearch_render: true
  - id: deepseek
    name: DeepSeek
    region: 国内
    category: model
    websearch_url: https://api-docs.deepseek.com/zh-cn/guides/web_search
  - id: qwen
    name: 阿里云百炼 (Qwen)
    region: 国内
    category: model
    websearch_url: https://help.aliyun.com/zh/model-studio/web-search
  - id: doubao
    name: 火山方舟 (豆包)
    region: 国内
    category: model
    websearch_url: https://www.volcengine.com/docs/82379/1500601
    websearch_render: true
  - id: zhipu
    name: 智谱 (GLM)
    region: 国内
    category: model
    websearch_url: https://docs.bigmodel.cn/cn/guide/tools/web-search
    websearch_render: true
  - id: moonshot
    name: 月之暗面 (Kimi)
    region: 国内
    category: model
    websearch_url: https://platform.kimi.com/docs/guide/web-search
  - id: minimax
    name: MiniMax
    region: 国内
    category: model
    websearch_url: https://platform.minimaxi.com/docs/guides/chat
    websearch_render: true

